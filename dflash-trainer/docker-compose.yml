services:
  dflash-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: dflash-trainer:latest
    container_name: dflash-trainer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./output:/output
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - LR=${LR:-1.5e-4}
      - CTX_LEN=${CTX_LEN:-4086}
      - BATCH_SIZE=${BATCH_SIZE:-8}
      - GRAD_ACCUM_STEPS=${GRAD_ACCUM_STEPS:-4}
      - MAX_GRAD_NORM=${MAX_GRAD_NORM:-1.0}
      - MAX_STEPS=${MAX_STEPS:-10000}
    command:
      - "--model-id"
      - "heretic-org/Qwen3.8-27B-heretic-ara"
      - "--output-dir"
      - "/output/Qwen3.8-27B-heretic-dflash"
      - "--max-steps"
      - "5000"
