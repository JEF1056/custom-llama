networks:
  # Shared network for llama-server and MCP server to communicate.
  # Note: NOT internal — cloudflared needs internet access to connect to Cloudflare.
  llama-net:

services:
  # ---------------------------------------------------------------------------
  # Model preparation (download / quantize / convert) — run before the server.
  # All model prep is handled here; the runtime image only serves /models.
  #
  # Build once:
  #   docker compose build llama-convert
  #
  # Then prepare a model (output lands in ./models via the shared volume):
  #
  #   Pre-built GGUF on HuggingFace:
  #     docker compose run --rm llama-convert download qwen3.5-27b --quant Q4_K_M
  #
  #   No pre-built quant but fp16 GGUF exists (quantized locally):
  #     docker compose run --rm llama-convert download qwen3.6-27b --quant TQ2_0
  #
  #   Safetensors-only repo (convert → fp16 GGUF → quantize):
  #     docker compose run --rm llama-convert convert-st qwen3.6-35b-a3b --quant TQ2_0
  #
  #   Re-quantize an existing GGUF already in ./models:
  #     docker compose run --rm llama-convert convert /models/model-Q8_0.gguf --quant Q4_K_M
  #
  # After preparation, start the server as normal:
  #   docker compose up llama-server
  # ---------------------------------------------------------------------------
  llama-convert:
    build:
      context: .
      dockerfile: Dockerfile
      target: convert
      args:
        CUDA_ARCHS: ${CUDA_ARCHS:-86}
    image: llama-convert:latest
    container_name: llama-convert
    profiles: ["convert"]

    volumes:
      - ./models:/models:rw

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

      # Throttle download write speed to prevent WSL2 vmmem balloon / BSOD.
      # Uses curl --limit-rate when set (e.g. CONVERT_DOWNLOAD_RATE=300M).
      # Leave unset to download at full speed.
      CONVERT_DOWNLOAD_RATE: ${CONVERT_DOWNLOAD_RATE:-}

      # Limit CPU threads used by llama-quantize during local quantization.
      # Leaving this unset defaults to cpu_count//2, which reserves half the
      # logical cores for the Windows host and prevents CLOCK_WATCHDOG_TIMEOUT
      # BSODs caused by Docker saturating every CPU core.
      # Override in .env: CONVERT_THREADS=4
      CONVERT_THREADS: ${CONVERT_THREADS:-}

    # No GPU needed — conversion and quantization run on CPU.

  # ---------------------------------------------------------------------------
  # llama.cpp inference server (TurboQuant fork)
  # Exposed publicly via Cloudflare Tunnel at chat.jessfan.com with
  # Cloudflare Access authentication.
  # ---------------------------------------------------------------------------
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        CUDA_ARCHS: ${CUDA_ARCHS:-86}
    image: llama-server:latest
    container_name: llama-server

    # No host port mapping — accessible only via Cloudflare Tunnel.

    volumes:
      - ./models:/models:rw

    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      # --- Entrypoint vars (see entrypoint.sh) ---
      LLAMA_HOST: ${LLAMA_HOST:-0.0.0.0}
      LLAMA_PORT: ${LLAMA_PORT:-8080}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      LLAMA_MODELS_PRESET: ${LLAMA_MODELS_PRESET:-/etc/llama-server/models.ini}
      LLAMA_MODELS_MAX: ${LLAMA_MODELS_MAX:-1}
      LLAMA_MODELS_AUTOLOAD: ${LLAMA_MODELS_AUTOLOAD:-on}
      LLAMA_WEBUI_CONFIG_FILE: ${LLAMA_WEBUI_CONFIG_FILE:-/etc/llama-server/webui-config.json}

      # --- CUDA tuning (env vars read directly by ggml-cuda) ---
      GGML_CUDA_GRAPH_OPT: ${GGML_CUDA_GRAPH_OPT:-1}
      CUDA_SCALE_LAUNCH_QUEUES: ${CUDA_SCALE_LAUNCH_QUEUES:-2x}

      # All other configuration (ctx, KV cache, sampling, speculative decoding,
      # DRY, reasoning budget, etc.) lives in scripts/models.ini.

    networks:
      - llama-net
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LLAMA_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # allow up to 5 min for large model to load from disk

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — exposes both llama-server and mcp-search-server publicly:
  #   - chat.jessfan.com → http://llama-server:8080
  #   - mcp.jessfan.com → http://mcp-search-server:3100
  # Both use Cloudflare Access authentication. Makes an outbound connection to Cloudflare.
  #
  # One-time setup in Cloudflare Zero Trust → Networks → Tunnels:
  #   1. Create tunnel → Docker → copy token to CF_TUNNEL_TOKEN in .env
  #   2. Add Public Hostname: chat.jessfan.com → http://llama-server:8080
  #   3. Add Public Hostname: mcp.jessfan.com → http://mcp-search-server:3100
  #   (Cloudflare creates the CNAME DNS records automatically.)
  #
  # Cloudflare Access setup (Zero Trust → Access → Applications):
  #   1. Create Application for chat.jessfan.com
  #   2. Create Application for mcp.jessfan.com
  #   3. Choose authentication method for each:
  #      - Google OAuth (same credentials as chat.jessfan.com)
  #      - Email/Password (users get a one-time code via email)
  #   4. Set "Who can access" to your email or "Anyone with the domain"
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}"
    networks:
      - llama-net
    restart: unless-stopped
    depends_on:
      - llama-server
      - mcp-search-server

  # ---------------------------------------------------------------------------
  # MCP Search Server — semantic web search with browser automation
  # Provides MCP tools accessible on the internal llama-net network
  # ---------------------------------------------------------------------------
  mcp-search-server:
    build:
      context: ./mcp-search-server
      dockerfile: Dockerfile
    container_name: mcp-search-server

    ports:
      - "${MCP_SERVER_HOST:-127.0.0.1}:${MCP_SERVER_PORT:-3100}:3100"

    volumes:
      # Only mount Python cache directory, not the entire .cache directory.
      # The .cache directory contains Playwright browsers which must not be overwritten
      # by an empty volume mount. Python cache goes in .cache/python instead.
      - mcp-cache:/app/.cache/python
      - /tmp/playwright:/tmp/playwright

    environment:
      MCP_SERVER_HOST: ${MCP_SERVER_HOST:-0.0.0.0}
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-3100}
      FILE_BASE_URL: ${FILE_BASE_URL:-https://mcp.jessfan.com}
      SEARCH_ENGINE: ${SEARCH_ENGINE:-duckduckgo}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      BROWSER_TIMEOUT: ${BROWSER_TIMEOUT:-30}
      MAX_RESULTS: ${MAX_RESULTS:-10}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-3600}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_CORS_ORIGINS: ${MCP_CORS_ORIGINS:-*}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MCP_SERVER_PORT:-3100}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - llama-net

  # ---------------------------------------------------------------------------
  # Chat UI — React SPA (Vite dev server)
  # ---------------------------------------------------------------------------
  chat-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: chat-ui
    ports:
      - "${CHAT_UI_PORT:-5173}:5173"
    environment:
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_ADMIN_UID: ${VITE_ADMIN_UID:-}
    networks:
      - llama-net
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./ui/src
          target: /app/src
        - action: rebuild
          path: ./ui/package.json

volumes:
  mcp-cache:
    driver: local