version: "3.8"

services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: llama-server:latest
    container_name: llama-server

    ports:
      - "8080:8080"

    volumes:
      - ./models:/models:rw

    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      LLAMA_THREADS: ${LLAMA_THREADS:-8}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-4096}
      LLAMA_GPU_LAYERS: ${LLAMA_GPU_LAYERS:-99}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:-512}
      LLAMA_TOP_P: ${LLAMA_TOP_P:-0.95}
      LLAMA_TEMP: ${LLAMA_TEMP:-0.7}

      LLAMA_MODEL: ${LLAMA_MODEL:-}
      LLAMA_MMPROJ: ${LLAMA_MMPROJ:-}
      LLAMA_IMAGE: ${LLAMA_IMAGE:-}

      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_NAME: ${MODEL_NAME:-}
      TQ_QUANT: ${TQ_QUANT:-}
      MMPROJ: ${MMPROJ:-}

      LLAMA_CACHE_TYPE_K: ${LLAMA_CACHE_TYPE_K:-f16}
      LLAMA_CACHE_TYPE_V: ${LLAMA_CACHE_TYPE_V:-f16}
      LLAMA_FLASH_ATTN: ${LLAMA_FLASH_ATTN:-on}

      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-2}
      LLAMA_NO_MMAP: ${LLAMA_NO_MMAP:-off}
      LLAMA_REASONING: ${LLAMA_REASONING:-on}

      LLAMA_TS: ${LLAMA_TS:-}
      LLAMA_NCMOE: ${LLAMA_NCMOE:-}
      LLAMA_CACHE_CAPACITY: ${LLAMA_CACHE_CAPACITY:-4096}

      LLAMA_MUL_KV: ${LLAMA_MUL_KV:-on}
      LLAMA_CACHE_CHUNK_SIZE: ${LLAMA_CACHE_CHUNK_SIZE:-0}
      LLAMA_NO_KV_OFFLOAD: ${LLAMA_NO_KV_OFFLOAD:-off}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s