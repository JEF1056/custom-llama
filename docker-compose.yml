version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Model preparation (download / quantize / convert) — run before the server.
  # All model prep is handled here; the runtime image only serves /models.
  #
  # Build once:
  #   docker compose build llama-convert
  #
  # Then prepare a model (output lands in ./models via the shared volume):
  #
  #   Pre-built GGUF on HuggingFace:
  #     docker compose run --rm llama-convert download qwen3.5-27b --quant Q4_K_M
  #
  #   No pre-built quant but fp16 GGUF exists (quantized locally):
  #     docker compose run --rm llama-convert download qwen3.6-27b --quant TQ2_0
  #
  #   Safetensors-only repo (convert → fp16 GGUF → quantize):
  #     docker compose run --rm llama-convert convert-st qwopus3.6-35b --quant TQ2_0
  #
  #   Re-quantize an existing GGUF already in ./models:
  #     docker compose run --rm llama-convert convert /models/model-Q8_0.gguf --quant Q4_K_M
  #
  # After preparation, start the server as normal:
  #   docker compose up llama-server
  # ---------------------------------------------------------------------------
  llama-convert:
    build:
      context: .
      dockerfile: Dockerfile
      target: convert
    image: llama-convert:latest
    container_name: llama-convert
    profiles: ["convert"]

    volumes:
      - ./models:/models:rw

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

    # No GPU needed — conversion and quantization run on CPU.

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: llama-server:latest
    container_name: llama-server

    ports:
      - "${LLAMA_PORT:-8080}:${LLAMA_PORT:-8080}"

    volumes:
      - ./models:/models:rw

    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      LLAMA_HOST: ${LLAMA_HOST:-0.0.0.0}
      LLAMA_PORT: ${LLAMA_PORT:-8080}

      LLAMA_THREADS: ${LLAMA_THREADS:-6}
      LLAMA_THREADS_BATCH: ${LLAMA_THREADS_BATCH:-12}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-200000}
      LLAMA_BATCH_SIZE: ${LLAMA_BATCH_SIZE:-4096}
      LLAMA_UBATCH_SIZE: ${LLAMA_UBATCH_SIZE:-1024}
      LLAMA_GPU_LAYERS: ${LLAMA_GPU_LAYERS:-99}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:--1}
      LLAMA_TOP_P: ${LLAMA_TOP_P:-0.95}
      LLAMA_TEMP: ${LLAMA_TEMP:-0.7}
      LLAMA_STOP: ${LLAMA_STOP:-}

      LLAMA_MODEL: ${LLAMA_MODEL:-}
      LLAMA_MMPROJ: ${LLAMA_MMPROJ:-}
      LLAMA_IMAGE: ${LLAMA_IMAGE:-}

      MODEL_NAME: ${MODEL_NAME:-}
      QUANT: ${QUANT:-}
      TQ_QUANT: ${TQ_QUANT:-}

      LLAMA_CACHE_TYPE_K: ${LLAMA_CACHE_TYPE_K:-f16}
      LLAMA_CACHE_TYPE_V: ${LLAMA_CACHE_TYPE_V:-f16}
      LLAMA_FLASH_ATTN: ${LLAMA_FLASH_ATTN:-on}

      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-2}
      LLAMA_NO_MMAP: ${LLAMA_NO_MMAP:-off}
      LLAMA_REASONING: ${LLAMA_REASONING:-on}
      LLAMA_PRESERVE_THINKING: ${LLAMA_PRESERVE_THINKING:-on}

      LLAMA_TS: ${LLAMA_TS:-}
      LLAMA_NCMOE: ${LLAMA_NCMOE:-}
      LLAMA_CACHE_CAPACITY: ${LLAMA_CACHE_CAPACITY:-200000}

      LLAMA_MUL_KV: ${LLAMA_MUL_KV:-on}
      LLAMA_CACHE_CHUNK_SIZE: ${LLAMA_CACHE_CHUNK_SIZE:-0}
      LLAMA_NO_KV_OFFLOAD: ${LLAMA_NO_KV_OFFLOAD:-off}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LLAMA_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # allow up to 5 min for large model to load from disk