# PROD compose — builds the CUDA server and starts the LiteLLM router.
#
# BUILD_MODE (default: git) clones our JEF1056/ik_llama.cpp fork's
# ngram-mtp-vision-chain branch (LLAMA_REPO/LLAMA_REF below) during the
# image build - a patch on top of stock ikawrakow/ik_llama.cpp allowing an
# n-gram lookup drafter to chain alongside MTP even when the vision tower is
# loaded (stock ik_llama.cpp silently disables ALL speculative decoding in
# that combination - see docs/iqllama-migration-plan.md and repo memory for
# the full investigation). Override LLAMA_REPO/LLAMA_REF to build stock
# upstream ikawrakow/ik_llama.cpp@main instead, or set BUILD_MODE=local to
# build from an external host checkout via a named build context (see
# docker/docker-compose.yml's dev setup for that variant).
#
# Prerequisites:
#   cp docker/.env.example docker/.env     # set QWEN_TOKEN, tune CTX etc.
#   cp router/.env.example router/.env     # set LITELLM_MASTER_KEY, MAC_BACKEND_URL
#
# Weights live in the qwen36-models NAMED VOLUME, not in the image, so they
# survive `docker compose up -d --force-recreate` / image rebuilds (only
# `docker compose down -v` or `docker volume rm` clears them). Two opt-in
# one-shot jobs populate that volume, gated behind Compose profiles so a plain
# `docker compose up` never triggers a multi-GB download on its own:
#   docker compose --profile bringup run --rm model-bringup   # fast: one public
#                                                               # pre-quantized GGUF
#   docker compose --profile prep    run --rm model-prep      # slow: full Phase 2
#                                                               # BF16->imatrix->quantize
# Then set MODEL_SOURCE/GGUF_FILE/MMPROJ_FILE in docker/.env to match (see
# docker/.env.example) and start/recreate the server.
#
# First run:
#   docker compose up -d --build
#
# The CUDA server and router share the bonsai-net bridge network. The router
# reaches the CUDA server at http://server:8080/v1 without exposing any
# additional host ports. The router waits for the CUDA server to be healthy
# before starting (depends_on + condition: service_healthy).
#
# Subsequent restarts (no code change): docker compose up -d
# Rebuild image (after Dockerfile changes, or a new commit on the fork
# branch): docker compose up -d --build
#
# Requires the NVIDIA Container Toolkit on the host.

services:
  server:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
        CUDA_ARCH: ${CUDA_ARCH:-86}
    image: custom-llama/qwen36-cuda:latest
    container_name: server
    env_file: ./docker/.env
    environment:
      LLAMA_CACHE: /models
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - qwen36-models:/models
      - qwen36-data:/workspace
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - bonsai-net
    # Raises the locked-memory ceiling so --mlock (docker/.env's USE_MLOCK=1)
    # can actually lock the model into RAM if enabled; harmless/no-op if
    # USE_MLOCK stays at its default of 0.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      # Generous: first boot downloads several GB of weights.
      start_period: 1800s
    restart: unless-stopped

  # One-shot job: fetch a single public pre-quantized GGUF + mmproj for fast
  # bring-up/smoke-testing (docs/iqllama-migration-plan.md Phase 6), before the
  # in-house recipe (model-prep, below) is ready. Writes into the same
  # qwen36-models volume the server reads from, under plain filenames
  # (qwen36-bringup.gguf by default) - point docker/.env's GGUF_FILE at it.
  # Not started by `docker compose up` (profile-gated); run explicitly:
  #   docker compose --profile bringup run --rm model-bringup
  model-bringup:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
        CUDA_ARCH: ${CUDA_ARCH:-86}
    image: custom-llama/qwen36-cuda:latest
    container_name: qwen36-model-bringup
    profiles: ["bringup"]
    entrypoint: ["/bin/bash", "/scripts/download-bringup.sh"]
    env_file: ./docker/.env
    volumes:
      - qwen36-models:/models
      - ./scripts:/scripts:ro
    networks:
      - bonsai-net
    restart: "no"

  # One-shot job: the full Phase 2 pipeline (download Unsloth BF16 shards ->
  # compute our own diverse imatrix -> llama-quantize with the
  # "262K-Balanced" recipe). Slow (large download + imatrix pass + quantize);
  # needs GPU for -ngl on the imatrix step. Writes into qwen36-models, so it
  # survives server --force-recreate/rebuilds. Not started by `docker compose
  # up` (profile-gated); run explicitly:
  #   docker compose --profile prep run --rm model-prep
  model-prep:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
        CUDA_ARCH: ${CUDA_ARCH:-86}
    image: custom-llama/qwen36-cuda:latest
    container_name: qwen36-model-prep
    profiles: ["prep"]
    entrypoint: ["/bin/bash", "/scripts/prepare-weights.sh"]
    volumes:
      - qwen36-models:/models
      - ./scripts:/scripts:ro
    networks:
      - bonsai-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # One-shot: same Phase 2 pipeline as model-prep but running entirely on
  # CPU — no NVIDIA toolkit or GPU reservation needed.  NGL=0 forces CPU for
  # the imatrix pass from the start (skips the OOM-fallback path).  imatrix
  # on CPU is slow (~hours for 200 chunks on a 66 GB BF16 GGUF) but produces
  # the same output as the GPU path.  Run explicitly:
  #   docker compose --profile prep-cpu run --rm model-prep-cpu
  model-prep-cpu:
    build:
      context: ./docker
      dockerfile: Dockerfile.cpu
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
    image: custom-llama/qwen36-cpu:latest
    container_name: qwen36-model-prep-cpu
    profiles: ["prep-cpu"]
    entrypoint: ["/bin/bash", "/scripts/prepare-weights.sh"]
    environment:
      NGL: "0"
    volumes:
      - qwen36-models:/models
      - ./scripts:/scripts:ro
    networks:
      - bonsai-net
    restart: "no"

  # CPU-only server — same weights volume, no GPU required.
  # Profile-gated so it doesn't start alongside the GPU server by default:
  #   docker compose --profile cpu up -d server-cpu
  #   docker compose --profile cpu up -d --build  # (re-)build first)
  # Exposes port CPU_PORT (default 8083) directly; the LiteLLM router is NOT
  # wired to this service by default (the router's CUDA_BACKEND_URL points at
  # the GPU `server`). To route through LiteLLM, add this as a model in
  # router/config.yaml and set CUDA_BACKEND_URL accordingly.
  server-cpu:
    build:
      context: ./docker
      dockerfile: Dockerfile.cpu
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
    image: custom-llama/qwen36-cpu:latest
    container_name: server-cpu
    profiles: ["cpu"]
    env_file: ./docker/.env
    environment:
      LLAMA_CACHE: /models
      # CPU-only: disable GPU-specific features unconditionally.
      NGL: "0"
      FLASH_ATTN: "off"
      KV_HADAMARD: "0"
      ENABLE_MTP: "0"
    ports:
      - "${CPU_PORT:-8083}:8080"
    volumes:
      - qwen36-models:/models
      - qwen36-data:/workspace
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - bonsai-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  router:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: bonsai-router
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${ROUTER_PORT:-4000}:4000"
    env_file: ./router/.env
    environment:
      # Override CUDA_BACKEND_URL to use the Docker service name so the router
      # reaches the CUDA server over the shared bonsai-net bridge without
      # requiring the host IP to be set in router/.env.
      CUDA_BACKEND_URL: http://server:8080/v1
    volumes:
      - ./router/config.yaml:/app/config.yaml:ro
    networks:
      - bonsai-net
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  bonsai-net:
    driver: bridge

volumes:
  qwen36-data:
  qwen36-models:
