networks:
  # Shared network for vllm-server and MCP server to communicate.
  # Note: NOT internal — cloudflared needs internet access to connect to Cloudflare.
  llama-net:

services:
  # ---------------------------------------------------------------------------
  # Model download — run before the server to pull safetensors weights.
  #
  # Build once:
  #   docker compose build model-prep
  #
  # Download a model (output lands in ./models via the shared volume):
  #   docker compose run --rm model-prep download qwen3.6-27b-autoround
  #   docker compose run --rm model-prep download qwen3.6-35b-a3b-autoround
  #
  # List available models:
  #   docker compose run --rm model-prep list
  #
  # After download, start the server:
  #   docker compose up vllm-server
  # ---------------------------------------------------------------------------
  model-prep:
    build:
      context: .
      dockerfile: Dockerfile.modelprep
    image: model-prep:latest
    container_name: model-prep
    profiles: ["convert"]

    volumes:
      - ./models:/models:rw

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

  # ---------------------------------------------------------------------------
  # vLLM inference server — OpenAI-compatible API (v0.22.0)
  # Exposed publicly via Cloudflare Tunnel at chat.jessfan.com with
  # Cloudflare Access authentication.
  # ---------------------------------------------------------------------------
  vllm-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-server:latest
    container_name: vllm-server

    # No host port mapping — accessible only via Cloudflare Tunnel.

    volumes:
      - ./models:/models:rw
      - hf-cache:/root/.cache/huggingface:rw

    gpus: all

    # Required for large model shared memory and inter-GPU communication.
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      HF_TOKEN: ${HF_TOKEN:-}

      VLLM_HOST: ${VLLM_HOST:-0.0.0.0}
      VLLM_PORT: ${VLLM_PORT:-8080}
      VLLM_API_KEY: ${VLLM_API_KEY:-}

      VLLM_MODEL_PATH: ${VLLM_MODEL_PATH:-}
      VLLM_QUANTIZATION: ${VLLM_QUANTIZATION:-}
      VLLM_TOKENIZER_PATH: ${VLLM_TOKENIZER_PATH:-}
      VLLM_SERVED_MODEL_NAME: ${VLLM_SERVED_MODEL_NAME:-}

      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-100000}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.95}
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-2}
      VLLM_TP_SIZE: ${VLLM_TP_SIZE:-1}
      VLLM_DTYPE: ${VLLM_DTYPE:-auto}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE:-turboquant_4bit_nc}
      VLLM_MAX_NUM_BATCHED_TOKENS: ${VLLM_MAX_NUM_BATCHED_TOKENS:-}
      VLLM_ENABLE_CHUNKED_PREFILL: ${VLLM_ENABLE_CHUNKED_PREFILL:-1}
      VLLM_ENABLE_PREFIX_CACHING: ${VLLM_ENABLE_PREFIX_CACHING:-}
      VLLM_ENFORCE_EAGER: ${VLLM_ENFORCE_EAGER:-}

      VLLM_REASONING_PARSER: ${VLLM_REASONING_PARSER:-qwen3}

      VLLM_SPECULATIVE_CONFIG: "${VLLM_SPECULATIVE_CONFIG:-}"

      VLLM_SCHEDULING_POLICY: ${VLLM_SCHEDULING_POLICY:-}

      VLLM_DISABLE_LOG_REQUESTS: ${VLLM_DISABLE_LOG_REQUESTS:-}

      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}

    restart: unless-stopped

    networks:
      - llama-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # allow up to 5 min for large model to load from disk

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — exposes both vllm-server and mcp-search-server publicly:
  #   - chat.jessfan.com → http://vllm-server:8080
  #   - mcp.jessfan.com  → http://mcp-search-server:3100
  # Both use Cloudflare Access authentication. Makes an outbound connection to Cloudflare.
  #
  # One-time setup in Cloudflare Zero Trust → Networks → Tunnels:
  #   1. Create tunnel → Docker → copy token to CF_TUNNEL_TOKEN in .env
  #   2. Add Public Hostname: chat.jessfan.com → http://vllm-server:8080
  #   3. Add Public Hostname: mcp.jessfan.com → http://mcp-search-server:3100
  #   (Cloudflare creates the CNAME DNS records automatically.)
  #
  # Cloudflare Access setup (Zero Trust → Access → Applications):
  #   1. Create Application for chat.jessfan.com
  #   2. Create Application for mcp.jessfan.com
  #   3. Choose authentication method for each:
  #      - Google OAuth (same credentials as chat.jessfan.com)
  #      - Email/Password (users get a one-time code via email)
  #   4. Set "Who can access" to your email or "Anyone with the domain"
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}"
    networks:
      - llama-net
    restart: unless-stopped
    depends_on:
      - vllm-server
      - mcp-search-server

  # ---------------------------------------------------------------------------
  # MCP Search Server — semantic web search with browser automation
  # Provides MCP tools accessible on the internal llama-net network
  # ---------------------------------------------------------------------------
  mcp-search-server:
    build:
      context: ./mcp-search-server
      dockerfile: Dockerfile
    container_name: mcp-search-server

    ports:
      - "${MCP_SERVER_HOST:-127.0.0.1}:${MCP_SERVER_PORT:-3100}:3100"

    volumes:
      # Only mount Python cache directory, not the entire .cache directory.
      # The .cache directory contains Playwright browsers which must not be overwritten
      # by an empty volume mount. Python cache goes in .cache/python instead.
      - mcp-cache:/app/.cache/python
      - /tmp/playwright:/tmp/playwright

    environment:
      MCP_SERVER_HOST: ${MCP_SERVER_HOST:-0.0.0.0}
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-3100}
      FILE_BASE_URL: ${FILE_BASE_URL:-https://mcp.jessfan.com}
      SEARCH_ENGINE: ${SEARCH_ENGINE:-duckduckgo}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      BROWSER_TIMEOUT: ${BROWSER_TIMEOUT:-30}
      MAX_RESULTS: ${MAX_RESULTS:-10}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-3600}
      MCP_API_KEY: ${MCP_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MCP_SERVER_PORT:-3100}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - llama-net

  # ---------------------------------------------------------------------------
  # Chat UI — Vite dev server with Docker Watch
  #
  # Start with hot-reload:
  #   docker compose watch chat-ui
  #   docker compose up chat-ui --watch     # (Compose v2.22+)
  #
  # Or without watch (no HMR sync):
  #   docker compose up chat-ui
  #
  # Docker Watch actions:
  #   sync        src/, public/, index.html → Vite HMR picks up changes instantly
  #   sync+restart  vite.config.ts, tsconfig*.json → restarts Vite dev server
  #   rebuild     package*.json → reinstalls node_modules and rebuilds image
  #
  # Configure in .env: VITE_FIREBASE_* and VITE_ADMIN_UID
  # ---------------------------------------------------------------------------
  chat-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: chat-ui

    ports:
      - "${CHAT_UI_PORT:-5173}:5173"

    environment:
      # Proxy targets resolved via Docker network
      PROXY_API_TARGET: http://vllm-server:${VLLM_PORT:-8080}
      PROXY_MCP_TARGET: http://mcp-search-server:${MCP_SERVER_PORT:-3100}

      # Firebase config — set in .env
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_ADMIN_UID: ${VITE_ADMIN_UID:-}

    networks:
      - llama-net

    develop:
      watch:
        - action: sync
          path: ./ui/src
          target: /app/src
        - action: sync
          path: ./ui/public
          target: /app/public
        - action: sync
          path: ./ui/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./ui/vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ./ui/tsconfig.app.json
          target: /app/tsconfig.app.json
        - action: sync+restart
          path: ./ui/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./ui/package.json
        - action: rebuild
          path: ./ui/package-lock.json

volumes:
  mcp-cache:
    driver: local
  hf-cache:
    driver: local
