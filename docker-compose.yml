networks:
  # Shared network for llama-server and MCP server to communicate.
  # Note: NOT internal — cloudflared needs internet access to connect to Cloudflare.
  llama-net:

services:
  # ---------------------------------------------------------------------------
  # Model preparation (download / quantize / convert) — run before the server.
  # All model prep is handled here; the runtime image only serves /models.
  #
  # Build once:
  #   docker compose build llama-convert
  #
  # Then prepare a model (output lands in ./models via the shared volume):
  #
  #   Pre-built GGUF on HuggingFace:
  #     docker compose run --rm llama-convert download qwen3.5-27b --quant Q4_K_M
  #
  #   No pre-built quant but fp16 GGUF exists (quantized locally):
  #     docker compose run --rm llama-convert download qwen3.6-27b --quant TQ2_0
  #
  #   Safetensors-only repo (convert → fp16 GGUF → quantize):
  #     docker compose run --rm llama-convert convert-st qwopus3.6-35b --quant TQ2_0
  #
  #   Re-quantize an existing GGUF already in ./models:
  #     docker compose run --rm llama-convert convert /models/model-Q8_0.gguf --quant Q4_K_M
  #
  # After preparation, start the server as normal:
  #   docker compose up llama-server
  # ---------------------------------------------------------------------------
  llama-convert:
    build:
      context: .
      dockerfile: Dockerfile
      target: convert
    image: llama-convert:latest
    container_name: llama-convert
    profiles: ["convert"]

    volumes:
      - ./models:/models:rw

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

      # Throttle download write speed to prevent WSL2 vmmem balloon / BSOD.
      # Uses curl --limit-rate when set (e.g. CONVERT_DOWNLOAD_RATE=300M).
      # Leave unset to download at full speed.
      CONVERT_DOWNLOAD_RATE: ${CONVERT_DOWNLOAD_RATE:-}

      # Limit CPU threads used by llama-quantize during local quantization.
      # Leaving this unset defaults to cpu_count//2, which reserves half the
      # logical cores for the Windows host and prevents CLOCK_WATCHDOG_TIMEOUT
      # BSODs caused by Docker saturating every CPU core.
      # Override in .env: CONVERT_THREADS=4
      CONVERT_THREADS: ${CONVERT_THREADS:-}

    # No GPU needed — conversion and quantization run on CPU.

  # ---------------------------------------------------------------------------
  # llama.cpp inference server (TurboQuant fork)
  # Exposed publicly via Cloudflare Tunnel at api.jessfan.com with
  # Cloudflare Access authentication.
  # ---------------------------------------------------------------------------
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: llama-server:latest
    container_name: llama-server

    # No host port mapping — accessible only via Cloudflare Tunnel.

    volumes:
      - ./models:/models:rw

    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      LLAMA_HOST: ${LLAMA_HOST:-0.0.0.0}
      LLAMA_PORT: ${LLAMA_PORT:-8080}

      LLAMA_THREADS: ${LLAMA_THREADS:-8}
      LLAMA_THREADS_BATCH: ${LLAMA_THREADS_BATCH:-10}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-200000}
      LLAMA_BATCH_SIZE: ${LLAMA_BATCH_SIZE:-8192}
      LLAMA_UBATCH_SIZE: ${LLAMA_UBATCH_SIZE:-2048}
      LLAMA_GPU_LAYERS: ${LLAMA_GPU_LAYERS:-99}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:--1}
      LLAMA_TOP_P: ${LLAMA_TOP_P:-0.95}
      LLAMA_TEMP: ${LLAMA_TEMP:-0.6}
      LLAMA_TOP_K: ${LLAMA_TOP_K:-20}
      LLAMA_MIN_P: ${LLAMA_MIN_P:-0.0}
      LLAMA_PRESENCE_PENALTY: ${LLAMA_PRESENCE_PENALTY:-0.0}
      LLAMA_REPETITION_PENALTY: ${LLAMA_REPETITION_PENALTY:-1.0}
      LLAMA_STOP: ${LLAMA_STOP:-}

      LLAMA_MODEL: ${LLAMA_MODEL:-}
      LLAMA_MMPROJ: ${LLAMA_MMPROJ:-}
      LLAMA_IMAGE: ${LLAMA_IMAGE:-}

      MODEL_NAME: ${MODEL_NAME:-}
      QUANT: ${QUANT:-}
      TQ_QUANT: ${TQ_QUANT:-}

      LLAMA_CACHE_TYPE_K: ${LLAMA_CACHE_TYPE_K:-f16}
      LLAMA_CACHE_TYPE_V: ${LLAMA_CACHE_TYPE_V:-f16}
      LLAMA_FLASH_ATTN: ${LLAMA_FLASH_ATTN:-on}

      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-3}
      LLAMA_NO_MMAP: ${LLAMA_NO_MMAP:-off}
      LLAMA_DIRECT_IO: ${LLAMA_DIRECT_IO:-on}
      LLAMA_REASONING: ${LLAMA_REASONING:-on}
      LLAMA_PRESERVE_THINKING: ${LLAMA_PRESERVE_THINKING:-on}

      LLAMA_TS: ${LLAMA_TS:-}
      LLAMA_NCMOE: ${LLAMA_NCMOE:-}

      LLAMA_NO_KV_OFFLOAD: ${LLAMA_NO_KV_OFFLOAD:-off}
      LLAMA_KV_UNIFIED: ${LLAMA_KV_UNIFIED:-on}
      LLAMA_CACHE_RAM: ${LLAMA_CACHE_RAM:-}
      LLAMA_CLEAR_IDLE: ${LLAMA_CLEAR_IDLE:-on}
      LLAMA_CHECKPOINT_EVERY_N_TOKENS: ${LLAMA_CHECKPOINT_EVERY_N_TOKENS:-8192}
      LLAMA_CTX_CHECKPOINTS: ${LLAMA_CTX_CHECKPOINTS:-32}

      # MTP speculative decoding
      LLAMA_SPEC_TYPE: ${LLAMA_SPEC_TYPE:-}
      LLAMA_SPEC_DRAFT_N_MAX: ${LLAMA_SPEC_DRAFT_N_MAX:-}
      LLAMA_SPEC_DRAFT_P_MIN: ${LLAMA_SPEC_DRAFT_P_MIN:-}

      # KV cache reuse via shifting
      LLAMA_CACHE_REUSE: ${LLAMA_CACHE_REUSE:-}

      # RoPE scaling method
      LLAMA_ROPE_SCALING: ${LLAMA_ROPE_SCALING:-}

      # TriAttention (requires calibration file)
      LLAMA_TRIATTENTION_STATS: ${LLAMA_TRIATTENTION_STATS:-}
      LLAMA_TRIATTENTION_BUDGET: ${LLAMA_TRIATTENTION_BUDGET:-}
      LLAMA_TRIATTENTION_WINDOW: ${LLAMA_TRIATTENTION_WINDOW:-}
      LLAMA_TRIATTENTION_LOG: ${LLAMA_TRIATTENTION_LOG:-}

      # WebUI config file — supplies default MCP server + agentic turn limit
      LLAMA_WEBUI_CONFIG_FILE: ${LLAMA_WEBUI_CONFIG_FILE:-}

      # CUDA performance
      GGML_CUDA_GRAPH_OPT: ${GGML_CUDA_GRAPH_OPT:-}
      CUDA_SCALE_LAUNCH_QUEUES: ${CUDA_SCALE_LAUNCH_QUEUES:-}

      # DRY sampling (Don't Repeat Yourself) — anti-loop protection for reasoning models
      LLAMA_DRY_MULTIPLIER: ${LLAMA_DRY_MULTIPLIER:-0.4}
      LLAMA_DRY_BASE: ${LLAMA_DRY_BASE:-1.75}
      LLAMA_DRY_ALLOWED_LENGTH: ${LLAMA_DRY_ALLOWED_LENGTH:-128}
      LLAMA_DRY_PENALTY_LAST_N: ${LLAMA_DRY_PENALTY_LAST_N:-2048}
      
      # Reasoning budget — hard cap on tokens inside <think>…</think> per turn
      LLAMA_REASONING_BUDGET: ${LLAMA_REASONING_BUDGET:-4096}
      
      # KV cache slot persistence — saves/restores slot state to disk so
      # per-conversation KV caches survive server restarts.
      LLAMA_SLOT_SAVE_PATH: ${LLAMA_SLOT_SAVE_PATH:-/models/slots}

      # Optional API key — when set, all requests to the server must include
      # Authorization: Bearer <key>. Leave empty for unauthenticated access.
      # When exposed via Cloudflare Access, this provides an additional
      # layer of API-level authentication.
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}

    networks:
      - llama-net
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LLAMA_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # allow up to 5 min for large model to load from disk

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — exposes both llama-server and mcp-search-server publicly:
  #   - api.jessfan.com → http://llama-server:8080
  #   - files.jessfan.com → http://mcp-search-server:3100
  # Both use Cloudflare Access authentication. Makes an outbound connection to Cloudflare.
  #
  # One-time setup in Cloudflare Zero Trust → Networks → Tunnels:
  #   1. Create tunnel → Docker → copy token to CF_TUNNEL_TOKEN in .env
  #   2. Add Public Hostname: api.jessfan.com → http://llama-server:8080
  #   3. Add Public Hostname: files.jessfan.com → http://mcp-search-server:3100
  #   (Cloudflare creates the CNAME DNS records automatically.)
  #
  # Cloudflare Access setup (Zero Trust → Access → Applications):
  #   1. Create Application for api.jessfan.com
  #   2. Create Application for files.jessfan.com
  #   3. Choose authentication method for each:
  #      - Google OAuth (same credentials as chat.jessfan.com)
  #      - Email/Password (users get a one-time code via email)
  #   4. Set "Who can access" to your email or "Anyone with the domain"
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}"
    networks:
      - llama-net
    restart: unless-stopped
    depends_on:
      - llama-server
      - mcp-search-server

  # ---------------------------------------------------------------------------
  # MCP Search Server — semantic web search with browser automation
  # Used by llama-server's --webui-mcp-proxy to proxy MCP tool calls
  # ---------------------------------------------------------------------------
  mcp-search-server:
    build:
      context: ./mcp-search-server
      dockerfile: Dockerfile
    container_name: mcp-search-server

    ports:
      - "${MCP_SERVER_HOST:-127.0.0.1}:${MCP_SERVER_PORT:-3100}:3100"

    volumes:
      # Only mount Python cache directory, not the entire .cache directory.
      # The .cache directory contains Playwright browsers which must not be overwritten
      # by an empty volume mount. Python cache goes in .cache/python instead.
      - mcp-cache:/app/.cache/python
      - /tmp/playwright:/tmp/playwright

    environment:
      MCP_SERVER_HOST: ${MCP_SERVER_HOST:-0.0.0.0}
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-3100}
      FILE_BASE_URL: ${FILE_BASE_URL:-https://files.jessfan.com}
      SEARCH_ENGINE: ${SEARCH_ENGINE:-duckduckgo}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      BROWSER_TIMEOUT: ${BROWSER_TIMEOUT:-30}
      MAX_RESULTS: ${MAX_RESULTS:-10}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-3600}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MCP_SERVER_PORT:-3100}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - llama-net

volumes:
  mcp-cache:
    driver: local