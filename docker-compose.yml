# PROD compose — builds the CUDA server from git and starts the LiteLLM router.
#
# Prerequisites:
#   cp docker/.env.example docker/.env     # set BONSAI_TOKEN, tune CTX etc.
#   cp router/.env.example router/.env     # set LITELLM_MASTER_KEY, MAC_BACKEND_URL
#
# First run:
#   docker compose up -d --build
#
# The CUDA server and router share the bonsai-net bridge network. The router
# reaches the CUDA server at http://bonsai-cuda:8080/v1 without exposing any
# additional host ports. The router waits for the CUDA server to be healthy
# before starting (depends_on + condition: service_healthy).
#
# Subsequent restarts (no code change): docker compose up -d
# Rebuild image (after fork/Dockerfile changes): docker compose up -d --build
#
# Requires the NVIDIA Container Toolkit on the host.

services:
  server:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        BUILD_MODE: git
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/llama-cpp-turboquant.git}
        LLAMA_REF: ${LLAMA_REF:-dspark-integration}
        CUDA_ARCH: ${CUDA_ARCH:-86}
    image: custom-llama/bonsai-cuda:latest
    container_name: server
    env_file: ./docker/.env
    environment:
      LLAMA_CACHE: /models
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - bonsai-models:/models
      - bonsai-data:/workspace
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - bonsai-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      # Generous: first boot downloads several GB of weights.
      start_period: 1800s
    restart: unless-stopped

  router:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: bonsai-router
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${ROUTER_PORT:-4000}:4000"
    env_file: ./router/.env
    environment:
      # Override CUDA_BACKEND_URL to use the Docker service name so the router
      # reaches the CUDA server over the shared bonsai-net bridge without
      # requiring the host IP to be set in router/.env.
      CUDA_BACKEND_URL: http://server:8080/v1
    volumes:
      - ./router/config.yaml:/app/config.yaml:ro
    networks:
      - bonsai-net
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  bonsai-net:
    driver: bridge

volumes:
  bonsai-data:
  bonsai-models:
