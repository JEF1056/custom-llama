version: "3.8"

networks:
  # Internal network: llama-server, kv-cache-proxy, tailscale, pipelines.
  # No host port mappings on services here — access via tailnet or pipelines only.
  llama-net:
  # Semi-public network: open-webui, cloudflared, pipelines (bridges both nets).
  webui-net:

volumes:
  tailscale-state:    # Tailscale node state (identity key, node certs)
  open-webui-data:    # Open WebUI SQLite DB, uploads, config

services:
  # ---------------------------------------------------------------------------
  # Model preparation (download / quantize / convert) — run before the server.
  # All model prep is handled here; the runtime image only serves /models.
  #
  # Build once:
  #   docker compose build llama-convert
  #
  # Then prepare a model (output lands in ./models via the shared volume):
  #
  #   Pre-built GGUF on HuggingFace:
  #     docker compose run --rm llama-convert download qwen3.5-27b --quant Q4_K_M
  #
  #   No pre-built quant but fp16 GGUF exists (quantized locally):
  #     docker compose run --rm llama-convert download qwen3.6-27b --quant TQ2_0
  #
  #   Safetensors-only repo (convert → fp16 GGUF → quantize):
  #     docker compose run --rm llama-convert convert-st qwopus3.6-35b --quant TQ2_0
  #
  #   Re-quantize an existing GGUF already in ./models:
  #     docker compose run --rm llama-convert convert /models/model-Q8_0.gguf --quant Q4_K_M
  #
  # After preparation, start the server as normal:
  #   docker compose up llama-server
  # ---------------------------------------------------------------------------
  llama-convert:
    build:
      context: .
      dockerfile: Dockerfile
      target: convert
    image: llama-convert:latest
    container_name: llama-convert
    profiles: ["convert"]

    volumes:
      - ./models:/models:rw

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

      # Throttle download write speed to prevent WSL2 vmmem balloon / BSOD.
      # Uses curl --limit-rate when set (e.g. CONVERT_DOWNLOAD_RATE=300M).
      # Leave unset to download at full speed.
      CONVERT_DOWNLOAD_RATE: ${CONVERT_DOWNLOAD_RATE:-}

      # Limit CPU threads used by llama-quantize during local quantization.
      # Leaving this unset defaults to cpu_count//2, which reserves half the
      # logical cores for the Windows host and prevents CLOCK_WATCHDOG_TIMEOUT
      # BSODs caused by Docker saturating every CPU core.
      # Override in .env: CONVERT_THREADS=4
      CONVERT_THREADS: ${CONVERT_THREADS:-}

    # No GPU needed — conversion and quantization run on CPU.

  # ---------------------------------------------------------------------------
  # Tailscale sidecar — joins the tailnet and exposes llama-server and
  # kv-cache-proxy on the tailnet via TCP forwarding defined in serve.json.
  # Tailnet users access:
  #   http://<TS_HOSTNAME>.<tailnet>.ts.net:8080  → llama-server (raw API)
  #   http://<TS_HOSTNAME>.<tailnet>.ts.net:8181  → kv-cache-proxy (Roo Code)
  # ---------------------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-llama
    hostname: ${TS_HOSTNAME:-llama-api}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - llama-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # llama.cpp inference server (TurboQuant fork)
  # No host port mapping — reachable only via llama-net (pipelines, proxy)
  # or via the Tailscale sidecar on the tailnet.
  # ---------------------------------------------------------------------------
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: llama-server:latest
    container_name: llama-server

    # No ports: — port 8080 is accessible only within llama-net and via tailnet.

    volumes:
      - ./models:/models:rw

    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      LLAMA_HOST: ${LLAMA_HOST:-0.0.0.0}
      LLAMA_PORT: ${LLAMA_PORT:-8080}

      LLAMA_THREADS: ${LLAMA_THREADS:-6}
      LLAMA_THREADS_BATCH: ${LLAMA_THREADS_BATCH:-12}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-200000}
      LLAMA_BATCH_SIZE: ${LLAMA_BATCH_SIZE:-4096}
      LLAMA_UBATCH_SIZE: ${LLAMA_UBATCH_SIZE:-1024}
      LLAMA_GPU_LAYERS: ${LLAMA_GPU_LAYERS:-99}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:--1}
      LLAMA_TOP_P: ${LLAMA_TOP_P:-0.95}
      LLAMA_TEMP: ${LLAMA_TEMP:-0.7}
      LLAMA_STOP: ${LLAMA_STOP:-}

      LLAMA_MODEL: ${LLAMA_MODEL:-}
      LLAMA_MMPROJ: ${LLAMA_MMPROJ:-}
      LLAMA_IMAGE: ${LLAMA_IMAGE:-}

      MODEL_NAME: ${MODEL_NAME:-}
      QUANT: ${QUANT:-}
      TQ_QUANT: ${TQ_QUANT:-}

      LLAMA_CACHE_TYPE_K: ${LLAMA_CACHE_TYPE_K:-f16}
      LLAMA_CACHE_TYPE_V: ${LLAMA_CACHE_TYPE_V:-f16}
      LLAMA_FLASH_ATTN: ${LLAMA_FLASH_ATTN:-on}

      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-2}
      LLAMA_NO_MMAP: ${LLAMA_NO_MMAP:-off}
      LLAMA_REASONING: ${LLAMA_REASONING:-on}
      LLAMA_PRESERVE_THINKING: ${LLAMA_PRESERVE_THINKING:-on}

      LLAMA_TS: ${LLAMA_TS:-}
      LLAMA_NCMOE: ${LLAMA_NCMOE:-}

      LLAMA_NO_KV_OFFLOAD: ${LLAMA_NO_KV_OFFLOAD:-off}

      # KV cache slot persistence — saves/restores slot state to disk so
      # per-conversation KV caches survive server restarts.
      LLAMA_SLOT_SAVE_PATH: ${LLAMA_SLOT_SAVE_PATH:-/models/slots}

      # Optional API key — set to restrict direct tailnet API access.
      # Leave empty to allow unauthenticated access on the tailnet.
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}

    networks:
      - llama-net
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LLAMA_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # allow up to 5 min for large model to load from disk

  # ---------------------------------------------------------------------------
  # KV cache proxy — OpenAI-compatible proxy for Roo Code (tailnet only).
  # Binds sessions to llama.cpp slots via X-Session-ID request header and
  # manages save/restore transparently around each completion request.
  # Roo Code config: base URL = http://<TS_HOSTNAME>.<tailnet>.ts.net:8181/v1
  # ---------------------------------------------------------------------------
  kv-cache-proxy:
    build:
      context: ./kv-cache-proxy
    container_name: kv-cache-proxy
    environment:
      LLAMA_BASE_URL: http://llama-server:${LLAMA_PORT:-8080}
      NUM_SLOTS: ${LLAMA_PARALLEL:-2}
      PORT: ${KV_PROXY_PORT:-8181}
      SLOT_SAVE_ENABLED: "true"
    networks:
      - llama-net
    restart: unless-stopped
    depends_on:
      - llama-server

  # ---------------------------------------------------------------------------
  # Open WebUI Pipelines — intercepts requests between Open WebUI and
  # llama-server to inject id_slot / cache_prompt and handle KV save/restore.
  # Pipeline files in ./pipelines/ are auto-loaded at startup.
  # Sits on both networks: receives requests from webui-net, calls llama-net.
  # ---------------------------------------------------------------------------
  open-webui-pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: open-webui-pipelines
    volumes:
      - ./pipelines:/app/pipelines
    environment:
      LLAMA_BASE_URL: http://llama-server:${LLAMA_PORT:-8080}
      PIPELINES_API_KEY: ${PIPELINES_API_KEY:-0p3n-w3bu!}
    networks:
      - llama-net
      - webui-net
    restart: unless-stopped
    depends_on:
      - llama-server

  # ---------------------------------------------------------------------------
  # Open WebUI — chat UI gated by Google OAuth (OIDC via Firebase credentials).
  # Connects exclusively to open-webui-pipelines; never directly to llama-server.
  # Public access via Cloudflare Tunnel at https://chat.jessfan.com
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      WEBUI_URL: ${WEBUI_URL:-https://chat.jessfan.com}

      # Google OAuth — credentials from Firebase Console or Google Cloud Console.
      # Firebase Console → Authentication → Sign-in method → Google → Web SDK config.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL:-https://accounts.google.com/.well-known/openid-configuration}
      ENABLE_OAUTH_SIGNUP: ${ENABLE_OAUTH_SIGNUP:-true}

      # Route all completions through the pipelines server (KV cache management).
      OPENAI_API_BASE_URL: http://open-webui-pipelines:9099
      OPENAI_API_KEY: ${PIPELINES_API_KEY:-0p3n-w3bu!}

      # Disable Ollama integration (not used in this setup).
      ENABLE_OLLAMA_API: "false"

    networks:
      - webui-net
    restart: unless-stopped
    depends_on:
      - open-webui-pipelines

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — exposes Open WebUI publicly at chat.jessfan.com with
  # zero inbound firewall ports. Makes an outbound connection to Cloudflare.
  #
  # One-time setup in Cloudflare Zero Trust → Networks → Tunnels:
  #   1. Create tunnel → Docker → copy token to CF_TUNNEL_TOKEN in .env
  #   2. Add Public Hostname: chat.jessfan.com → http://open-webui:8080
  #   (Cloudflare creates the CNAME DNS record automatically.)
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    networks:
      - webui-net
    restart: unless-stopped
    depends_on:
      - open-webui
