[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-search-server"
version = "0.1.0"
description = "MCP server for web search and content extraction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "MCP Search Server", email = "mcp-search@example.com" },
]
keywords = ["mcp", "search", "web", "automation", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.9.0,<2",  # 1.9.0+ required for FastMCP.streamable_http_app()
    "patchright>=1.52.0",  # CDP-patched, undetected drop-in for Playwright
    "beautifulsoup4>=4.12.0",
    "httpx>=0.25.0",
    "duckduckgo-search>=5.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "html2text>=2024.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
mcp-search-server = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
