services:
  mcp-search-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-llama/mcp-search-server:latest
    container_name: mcp-search-server
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 3100
      SEARCH_ENGINE: ${SEARCH_ENGINE:-duckduckgo}
      MAX_RESULTS: ${MAX_RESULTS:-10}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-3600}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-false}
      DISPLAY: :99
      MCP_CORS_ORIGINS: "*"
      # Let the container's browser reach dev servers on the host (local UIs).
      # The browser rewrites localhost/127.0.0.1 -> BROWSER_HOST_TARGET.
      BROWSER_REWRITE_LOCALHOST: ${BROWSER_REWRITE_LOCALHOST:-true}
      BROWSER_HOST_TARGET: ${BROWSER_HOST_TARGET:-host.docker.internal}
    ports:
      - "3100:3100"
    # host.docker.internal is provided automatically by Docker Desktop and
    # Colima/Lima (it resolves to the real host). Do NOT force
    # "host.docker.internal:host-gateway" here: on those runtimes host-gateway
    # is the in-VM docker bridge, not the host, and would break local-UI access.
    # On plain native Linux (no Docker Desktop/Colima), uncomment one of these
    # to make host.docker.internal resolve to the host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - mcp-files:/app/mcp-files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  mcp-files:
