services:
  mcp-search-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-llama/mcp-search-server:latest
    container_name: mcp-search-server
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 3100
      SEARCH_ENGINE: ${SEARCH_ENGINE:-duckduckgo}
      MAX_RESULTS: ${MAX_RESULTS:-10}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-3600}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-false}
      DISPLAY: :99
      MCP_CORS_ORIGINS: "*"
    ports:
      - "3100:3100"
    volumes:
      - mcp-files:/app/mcp-files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  mcp-files:
