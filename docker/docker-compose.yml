services:
  llama-cpp-qwen38-27b-single:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-local}
        CUDA_ARCH: ${CUDA_ARCH:-86}
        BUILD_JOBS: 16
      additional_contexts:
        llama-src: ${LLAMA_LOCAL_PATH:-/home/jfan/ik_llama.cpp}
    image: custom-llama/qwen38-cuda:${BUILD_MODE:-local}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-qwen38-27b-single}"
    restart: ${CLUB3090_RESTART:-unless-stopped}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8080}}:8080"
    volumes:
      - qwen38-models:/models:ro
    environment:
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
      - LLAMA_ARG_CHAT_TEMPLATE_KWARGS=${LLAMA_ARG_CHAT_TEMPLATE_KWARGS:-{"reasoning_effort":"${REASONING_EFFORT:-low}"}}
      - CUDA_VISIBLE_DEVICES=${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0}}
    entrypoint:
      - /bin/bash
      - -c
      - |
        _spec_n="$${SPEC_N:-1}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        if [ "$$_spec_n" -gt 0 ]; then
          echo "[spec] drafter ON (SPEC_N=$$_spec_n)" >&2
          exec llama-server "$$@"
        fi
        ARGS=(); _skip=0
        for _a in "$$@"; do
          if [ "$$_skip" = 1 ]; then _skip=0; continue; fi
          case "$$_a" in
            --spec-type|--spec-draft-model|--spec-draft-n-max|--spec-draft-n-min|-md|--model-draft) _skip=1; continue ;;
          esac
          ARGS+=("$$_a")
        done
        echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - drafter flags removed" >&2
        exec llama-server "$${ARGS[@]}"
      - --
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-qwen38-27b-heretic-ara-iq4_kss.gguf}
      --mmproj /models/${MMPROJ_FILE:-mmproj-BF16.gguf}
      --alias ${SERVED_NAME:-qwen3.8-27b}
      -c ${CTX_SIZE:-200000}
      -b ${BATCH_SIZE:-4096}
      -ub ${UBATCH_SIZE:-1024}
      -ngl 99
      -fa on
      --cache-type-k ${KV_TYPE:-q4_0}
      --cache-type-v ${KV_TYPE:-q4_0}
      -np ${NP:-1}
      --spec-type mtp:n_max=${SPEC_N:-3},p_min=0.5
      --cache-ram ${CACHE_RAM_MIB:-8192}
      --ctx-checkpoints ${CTX_CHECKPOINTS:-16}
      --jinja
      --reasoning ${REASONING:-on}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --reasoning-budget ${REASONING_BUDGET:-4086}
      --temp 0.7
      --top-p 0.90
      --top-k 40
      --min-p 0.05
      --presence-penalty 0.1
      --repeat-penalty 1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  model-prep:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-local}
        CUDA_ARCH: ${CUDA_ARCH:-86}
      additional_contexts:
        llama-src: ${LLAMA_LOCAL_PATH:-/home/jfan/ik_llama.cpp}
    image: custom-llama/qwen38-cuda:${BUILD_MODE:-local}
    container_name: model-prep
    profiles: ["prep"]
    entrypoint: ["/bin/bash", "/scripts/prepare-weights.sh"]
    environment:
      - MMPROJ_FILE=mmproj-Q8_0.gguf
    volumes:
      - qwen38-models:/models
      - ../scripts:/scripts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

volumes:
  qwen38-models:
