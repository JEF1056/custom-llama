# Docker compose — CUDA server with dev/prod build profiles.
#
# BUILD_MODE (default: git) clones our JEF1056/ik_llama.cpp fork's
# ngram-mtp-vision-chain branch (LLAMA_REPO/LLAMA_REF below) during the
# image build - a patch on top of stock ikawrakow/ik_llama.cpp allowing an
# n-gram lookup drafter to chain alongside MTP even when the vision tower is
# loaded (stock ik_llama.cpp silently disables ALL speculative decoding in
# that combination - see docs/iqllama-migration-plan.md and repo memory for
# the full investigation). Override LLAMA_REPO/LLAMA_REF to build stock
# upstream ikawrakow/ik_llama.cpp@main instead, or set BUILD_MODE=local to
# build from an external host checkout via a named build context.
#
# Profiles:
#   docker compose up -d --build          # GPU server (dev or prod)
#   docker compose --profile dev up -d    # GPU server (dev build)
#   docker compose --profile prod up -d   # GPU server (prod build)
#   docker compose --profile cpu up -d    # CPU-only server
#   docker compose --profile prep run     # Full Phase 2 weights pipeline (GPU)
#   docker compose --profile prep-cpu run # Full Phase 2 weights pipeline (CPU)
#
# .env and entrypoint.sh changes take effect on the next `docker compose up -d`
# with no rebuild. Only Dockerfile, build-arg, or fork-checkout changes require
# `--build`.
#
# Weights live in the qwen38-models NAMED VOLUME, not in the image, so they
# survive `docker compose up -d --force-recreate` / image rebuilds (only
# `docker compose down -v` or `docker volume rm` clears them).
#
# Requires the NVIDIA Container Toolkit on the host.

services:
  # GPU server — default profile (runs without --profile flag)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
        CUDA_ARCH: ${CUDA_ARCH:-86}
        CUDA_VERSION: ${CUDA_VERSION:-13.3.0}
      additional_contexts:
        llama-src: ${LLAMA_LOCAL_PATH:-/home/jfan/ik_llama.cpp}
    image: custom-llama/qwen38-cuda:${BUILD_MODE:-git}
    container_name: server
    env_file: .env
    environment:
      LLAMA_CACHE: /models
      MODEL_NAME: qwen3.8-27b
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - qwen38-models:/models
      - qwen38-data:/workspace
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - qwen-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 1800s
    restart: unless-stopped

  # CPU-only server — profile-gated so it doesn't start alongside GPU by default
  server-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
      additional_contexts:
        llama-src: ${LLAMA_LOCAL_PATH:-/home/jfan/ik_llama.cpp}
    image: custom-llama/qwen38-cpu:${BUILD_MODE:-git}
    container_name: server-cpu
    profiles: ["cpu"]
    env_file: .env
    environment:
      LLAMA_CACHE: /models
      NGL: "0"
      FLASH_ATTN: "off"
      KV_HADAMARD: "0"
      ENABLE_MTP: "0"
    ports:
      - "${CPU_PORT:-8083}:8080"
    volumes:
      - qwen38-models:/models
      - qwen38-data:/workspace
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  # One-shot: full Phase 2 pipeline (safetensors download -> BF16 convert -> quantize).
  # Needs GPU for the imatrix pass. Writes into qwen38-models.
  #   docker compose --profile prep run --rm model-prep
  model-prep:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
        CUDA_ARCH: ${CUDA_ARCH:-86}
      additional_contexts:
        llama-src: ${LLAMA_LOCAL_PATH:-/home/jfan/ik_llama.cpp}
    image: custom-llama/qwen38-cuda:${BUILD_MODE:-git}
    container_name: model-prep
    profiles: ["prep"]
    entrypoint: ["/bin/bash", "/scripts/prepare-weights.sh"]
    env_file: .env
    volumes:
      - qwen38-models:/models
      - ../scripts:/scripts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # One-shot: same pipeline as model-prep but running entirely on CPU.
  #   docker compose --profile prep-cpu run --rm model-prep-cpu
  model-prep-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/ik_llama.cpp.git}
        LLAMA_REF: ${LLAMA_REF:-ngram-mtp-vision-chain}
      additional_contexts:
        llama-src: ${LLAMA_LOCAL_PATH:-/home/jfan/ik_llama.cpp}
    image: custom-llama/qwen38-cpu:${BUILD_MODE:-git}
    container_name: model-prep-cpu
    profiles: ["prep-cpu"]
    entrypoint: ["/bin/bash", "/scripts/prepare-weights.sh"]
    environment:
      NGL: "0"
    volumes:
      - qwen38-models:/models
      - ../scripts:/scripts:ro
    restart: "no"

networks:
  qwen-net:
    driver: bridge

volumes:
  qwen38-data:
  qwen38-models:
