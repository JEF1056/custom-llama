# DEV compose — builds and runs the CUDA server locally.
#
# Default (BUILD_MODE=git): clones LLAMA_REPO at LLAMA_REF during docker build.
# Local source (BUILD_MODE=local): copies from ./llama-local/ in this directory.
#   To use local source:
#     rsync -a --exclude='.git' /path/to/llama-cpp-turboquant/ docker/llama-local/
#     BUILD_MODE=local docker compose up -d --build
#
#   cp .env.example .env   # set BONSAI_TOKEN, tune CTX / KV_TYPE etc.
#   docker compose up -d --build
#
# .env and entrypoint.sh changes take effect on the next `docker compose up -d`
# with no rebuild. Only Dockerfile or build-arg changes require `--build`.
#
# Requires the NVIDIA Container Toolkit on the host.
services:
  bonsai-cuda-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-git}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/JEF1056/llama-cpp-turboquant.git}
        LLAMA_REF: ${LLAMA_REF:-dspark-integration}
        CUDA_ARCH: ${CUDA_ARCH:-86}
    image: custom-llama/bonsai-cuda:dev
    container_name: bonsai-cuda-dev
    env_file: .env
    environment:
      LLAMA_CACHE: /models
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Model weights cache: downloaded once, reused across restarts.
      # Cleared only by `docker volume rm docker_bonsai-models-dev`.
      - bonsai-models-dev:/models
      - bonsai-data-dev:/workspace
      # Live-mount the entrypoint so edits take effect without a rebuild.
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 1800s
    restart: unless-stopped

volumes:
  bonsai-data-dev:
  bonsai-models-dev:
