# LiteLLM router config: distribute one logical model ("qwen3.6-35b") across
# multiple OpenAI-compatible backends (the RTX 3090 CUDA server and the Mac MLX
# server). Requests are routed by lowest latency, with automatic retry on a
# healthy backend if one fails.
#
# ik_llama.cpp's Qwen3.6-35B-A3B build is CUDA-only (see docs/
# iqllama-migration-plan.md R6), so the Mac backend remains a separate
# deployment/model on its own MLX stack; keep both entries only if the Mac
# side is actually serving the same model family, otherwise point it at its
# own model_name.
#
# Both entries share the same model_name, so LiteLLM treats them as two
# deployments of one model and load-balances between them.

model_list:
  - model_name: qwen3.6-35b
    litellm_params:
      model: openai//models/qwen36-262k-balanced.gguf
      api_base: http://ml-1-wsl:8080/v1
      api_key: sk-noauth

  - model_name: qwen3.6-35b
    litellm_params:
      model: openai/llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved
      api_base: http://ml-2:8081/v1
      api_key: sk-noauth

  - model_name: qwen3.6-35b
    litellm_params:
      model: openai/llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved
      api_base: http://ml-3:8081/v1
      api_key: sk-noauth

  - model_name: qwen3.6-35b
    litellm_params:
      model: openai/llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved
      api_base: http://ml-4:8081/v1
      api_key: sk-noauth

router_settings:
  # Send each request to the deployment with the lowest observed latency.
  routing_strategy: latency-based-routing
  # On failure, retry on the other healthy deployment.
  num_retries: 3
  timeout: 600
  # Cool a deployment down after this many failures, for this many seconds.
  allowed_fails: 2
  cooldown_time: 30

litellm_settings:
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Periodically ping backends so unhealthy ones are skipped proactively.
  background_health_checks: true
  health_check_interval: 30
