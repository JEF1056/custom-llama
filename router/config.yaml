server:
  host: "0.0.0.0"
  port: 40114
  write_timeout: 0s

proxy:
  engine: "olla"
  profile: "auto"
  load_balancer: "priority"
  response_timeout: 15m
  read_timeout: 10m

discovery:
  static:
    endpoints:
      - url: "http://100.118.67.28:8080"
        name: "ml-1-wsl-cuda"
        type: "llamacpp"
        priority: 100

      - url: "http://100.77.84.65:8080"
        name: "ml-2-mlx"
        type: "openai-compatible"
        priority: 95

      - url: "http://100.93.207.60:8080"
        name: "ml-3-mlx"
        type: "openai-compatible"
        priority: 90

      - url: "http://100.66.209.104:8080"
        name: "ml-4-mlx"
        type: "openai-compatible"
        priority: 50

model_registry:
  type: "memory"
  enable_unifier: true
  routing_strategy:
    type: "strict"
    options:
      fallback_behavior: "compatible_only"
  unification:
    enabled: true
    stale_threshold: 24h
    cleanup_interval: 10m

model_aliases:
  qwen3.6-35b:
    - /models/qwen3.6-35b
    - /Users/jfan/.qwen/models/qwen36-mlx

translators:
  anthropic:
    enabled: true
    passthrough_enabled: true

logging:
  level: "info"
  format: "json"
