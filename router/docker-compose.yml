version: "3.8"

services:
  redis:
    image: redis/redis-stack:latest
    container_name: router-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - router-net

  vllm-sr:
    build: ./
    container_name: vllm-sr
    restart: unless-stopped
    ports:
      - "4000:8888"  # API (OpenAI-compatible)
      - "8700:8700"  # Dashboard
      - "9190:9190"  # Prometheus metrics
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - router-net

volumes:
  redis-data:

networks:
  router-net:
    driver: bridge
