version = 1

; =============================================================================
; Global defaults — inherited by all model instances.
; Per-model sections below override these values.
; Keys use the long-form CLI arg name (without leading --).
; Boolean flags: true/false or on/off. Negated flags use the "no-" prefix.
; =============================================================================
[*]

; Logging: 3=info (server-level), 4=trace (includes llama-internal INFO, e.g.
; triattention init/eviction messages). Default is 3 which silently drops all
; LLAMA_LOG_INFO calls (they map to LOG_LEVEL_TRACE=4 in the common log system).
log-verbosity             = 4

; GPU
n-gpu-layers              = 99
flash-attn                = true
direct-io                 = true

; VRAM auto-fit: probe available VRAM and pick the largest ctx that fits,
; leaving fit-target MiB free per device. fit-ctx is the minimum ctx floor
; (fit will fail rather than go below this). ctx-size must be unset (or 0)
; in per-model sections for fit to control it — explicit ctx-size overrides fit.
fit                       = false
;fit-target                = 2000
;fit-ctx                   = 210000

; KV cache quantization (16 attention layers in 27B; all layers in 35B-A3B).
; turbo4 = 4-bit K (requires Flash Attention), turbo2 = 2-bit V.
cache-type-k              = turbo4
cache-type-v              = turbo2
kv-unified                = true
kv-offload                = true

; Host-memory prompt cache. Idle-slot KV is serialised to RAM and hot-swapped
; back when prefix overlap makes restore cheaper than re-processing.
cache-ram                 = 10240
cache-idle-slots          = true

; Reuse cached KV when requests share a common prefix (min chunk in tokens).
; Now works for M-RoPE multimodal models (Qwen3-VL) — commit 45905c72.
cache-reuse               = 256
kv-autosave-interval      = 600

; Generation defaults
n-predict                 = -1
temp                      = 1.0
top-p                     = 0.95
; Lowered from 20: with min-p=0.05 already filtering the tail, top-k=10 further
; concentrates sampling. Code/reasoning outputs have clear best-token choices;
; modelling shows this raises per-position draft acceptance ~0.69→0.75 (+28% spec efficiency).
top-k                     = 10
; Raised from 0.0: filters tokens below 5% of top-token probability, concentrating
; the sampling distribution and making draft-mtp predictions more accurate.
; Has negligible quality impact (sub-5% tokens rarely produce good output).
min-p                     = 0.05
presence-penalty          = 0.0
repeat-penalty            = 1.0

; parallel = 1 prevents concurrent prefill starvation.
; opencode sends simultaneous requests (title-gen + main chat); with 2 slots
; both start together and the large codebase prefill (13K+ tokens) dominates
; GPU compute, degrading the main chat to 7-20 t/s prompt eval vs ~140 t/s solo.
; With 1 slot, the title-gen queues behind the main chat and both run at full speed.
parallel                  = 1
threads                   = 8
threads-batch             = 16
batch-size                = 4086
ubatch-size               = 1028

; Image params
; Offload mmproj to CPU: frees ~1.2 GB VRAM on GPU at the cost of first-image latency.
; Workload is text-dominant (opencode/coding); image requests are rare.
no-mmproj-offload         = true
image-min-tokens          = 1028
image-max-tokens          = 1028

; DRY anti-loop sampling (sequence-aware; dry-allowed-length guards JSON/code).
dry-multiplier            = 0.4
dry-base                  = 1.75
dry-allowed-length        = 128
dry-penalty-last-n        = 2048

; Reasoning hard cap per turn (tokens inside <think>…</think>).
reasoning-budget          = 4096
reasoning-format          = deepseek

; ngram-mod speculative decoding secondary path (fast, CPU-only).
; n-match=24 + n-min=48 fired only ~1% of steps despite 100% acceptance when it did.
; Lowering match threshold to 8 catches repetitive code/reasoning patterns far more
; often; n-min=8 allows short drafts to go through rather than being suppressed.
spec-default              = true
spec-ngram-mod-n-match    = 40
spec-ngram-mod-n-min      = 0
; Lowered from 64: observed avg accepted = 8 tokens/chain despite 63 tokens generated.
; n_max=16 captures the same accepted tokens while cutting wasted verification 4x.
spec-ngram-mod-n-max      = 16

; Jinja chat-template engine.
jinja                     = true

; GPU-side sampling: eliminates PCIe logit download + CPU sort/sample per token.
; Active during thinking phase (lazy grammar not triggered); falls back to CPU
; for grammar-constrained output tokens (tool calls / structured output).
; Also works with speculative decoding: llama_get_sampled_token_ith resolves per
; output row so all verification positions are GPU-sampled.
backend-sampling          = true

; MTP speculative decoding (requires --mtp GGUF from convert-st).
; 1 nextn_predict_layers head; ngram-mod secondary path mirrors 27B config.
spec-type                 = draft-mtp,ngram-mod
; n_max=2 is the throughput optimum on the 27B hybrid (48 DeltaNet recurrent +
; 16 attention layers). Per-token measured acceptance vs n_max:
;   n_max=2 → 53-60% accept, 53-56 t/s   (best)
;   n_max=3 → 40-48% accept, 47-55 t/s
;   n_max=4 → 33%   accept, 42 t/s
;   n_max=8 → 13-18% accept, 27-32 t/s   (old value — over-drafting)
; Wider drafts dilute acceptance and waste MTP draft-gen (~2.3ms/tok) plus the
; per-step recurrent-state rollback across all 48 DeltaNet layers. Keep n_max small.
spec-draft-n-max          = 2
; Stop extending a draft chain when the draft head's top-token probability drops
; below 5%. Eliminates wasted verification on uncertain positions (default=0.0).
spec-draft-p-min          = 0.3
spec-draft-type-k         = turbo4
spec-draft-type-v         = turbo2
spec-draft-backend-sampling = true


; =============================================================================
; qwopus3.6-27b — Hybrid architecture (DeltaNet + Gated Attention), MTP-capable
;
; Architecture: 64 layers — 48 DeltaNet (linear-recurrent, NO KV cache) +
;               16 Gated Attention (GQA, 24Q/4KV heads, head_dim 256)
;
; Quant: IQ4_XS (4.25 bits/weight) chosen over IQ4_NL (4.5 bits/weight).
;   Both are near-identical in perplexity (<0.1 PPL delta at 27B scale).
;   IQ4_XS is ~0.9 GB smaller and ~9% faster due to lower bytes/weight,
;   with no practical quality regression for a reasoning model at this size.
;
; VRAM budget (RTX 3090 24GB, IQ4_XS+MTP):
;   weights + mmproj          ~10.8 GB  (9.6 + 1.2)
;   DeltaNet recurrent state  ~3.5 GB   (recurrent layers, fixed regardless of ctx)
;   KV cache (turbo4/2)       ~0.007 GB per 1K ctx  (16L × 4KV × 256D)
;   draft-mtp KV (f16, 3L)   ~0.003 GB per 1K ctx
; compute scratch            ~1.0 GB   (batch=4086/ubatch=1028)
;   CUDA + misc               ~0.6 GB
;   ─────────────────────────────────────
;   Fixed overhead            ~16.0 GB  → ~8 GB headroom for KV cache
;   fit will maximise ctx within the 256 MiB margin, floor 200K tokens.
;
; DeltaNet checkpoint budget (stored in system RAM, not VRAM):
;   Each checkpoint = 1 seq × 48 recurrent layers × ~49.4 MiB = ~49 MiB
;   Setting higher wastes RAM; lower risks FIFO-evicting early checkpoints.
;
; Note: cache-reuse (chunk-shifting) now works for M-RoPE multimodal models
;   including Qwen3.5/3.6 — get_can_shift() was fixed for LLAMA_ROPE_TYPE_MROPE
;   in commit 45905c72 so llama_memory_can_shift() returns true. Same-image KV
;   prefix reuse (get_common_prefix, FNV hash match) continues to work as before.
;   Checkpoints (ctx-checkpoints) are created after image batches, so slot
;   swaps restore from checkpoint instead of forcing a full re-process.
;
; Download:
;   docker compose run --rm llama-convert convert-st qwopus3.6-27b --quant IQ4_XS --mtp
;   (produces /models/qwopus3.6-27b-IQ4_XS-mtp.gguf + /models/qwopus3.6-27b-mmproj.gguf)
; =============================================================================
[qwopus3.6-27b]

model                     = /models/qwopus3.6-27b-IQ4_XS-mtp.gguf
mmproj                    = /models/qwopus3.6-27b-mmproj.gguf

; ctx-size intentionally omitted — fit will probe VRAM and maximise context,
; floored at fit-ctx = 200000 tokens with 256 MiB headroom (see [*] section).
ctx-size                  = 204800
rope-scaling              = yarn
rope-scale                = 6.25
yarn-orig-ctx             = 32768

; DeltaNet recurrent-state checkpointing (no-op for non-recurrent layers).
; Required for long-context KV restore; omit for pure transformer models.
; ctx-checkpoints computed automatically by sync-env.py: ceil(ctx-size / checkpoint-every-n-tokens)
; interval=8192, cap=24 = ceil(196608/8192): at full context exactly 24 checkpoints are created
; with zero FIFO eviction. At 156K context (typical), 20 checkpoints are created covering
; positions 8K–156K — first checkpoint always preserved. When a new conversation shares only
; ~13K tokens with the old context, restores from the 8K checkpoint and reprocesses ~5K tokens
; instead of forcing a full 156K-token re-process (~312s wasted).
; RAM: 24 × avg ~290 MiB ≈ 7.0 GB max (vs 16 × latest-only ≈ 4.8–5.3 GB); +~2 GB worst case.
ctx-checkpoints           = 24
checkpoint-every-n-tokens = 8192

; Reasoning / thinking
reasoning                 = on
chat-template-kwargs      = {"preserve_thinking":true}

; Slot save/restore
slot-save-path            = /models/slots/qwopus3.6-27b


; TriAttention KV cache eviction (arXiv 2604.04921).
; Prunes lowest-scoring attention KV cells every tri-window decode tokens,
; keeping only tri-budget % of the cache. DeltaNet recurrent layers are
; unaffected (fixed-size state, not evictable).
;
; Pre-built stats from domvox/triattention-ggml (PPL-validated on Qwen3.5-27B):
;   wget -O config/qwen3.5-27b-triattention.bin \
;     https://github.com/domvox/triattention-ggml/raw/master/stats/qwen3.5-27b.bin
; Or generate locally:
;   docker compose run --rm llama-convert convert-st qwen3.5-27b --quant Q4_K_M
;
; Budget: percentage of attention KV cells to retain after each prune.
;   75 = keep 75% → ~33% attention speedup at 18K context
;   50 = keep 50% → ~50% speedup but measurable quality degradation
; Start conservative (75) and lower if quality holds.
;
; Window: recent tokens always protected from eviction (attention sinks + recent).
; Interval: score+prune every N decode tokens (overhead: <10ms/event on RTX 3090).
;
; DISABLED by default — requires /etc/llama-server/qwopus3.6-27b-triattention.bin to exist.
; To enable: remove the leading semicolons from the lines below.
; triattention arg renamed from --triattention-stats in v2 config (commit 50fd78f4).
triattention              = /etc/llama-server/qwopus3.6-27b-triattention.bin
; 50: only 16/64 layers are attention (DeltaNet recurrent layers are unaffected),
; so quality risk is low. Keeps 50% of KV cells → ~50% attention speedup at long ctx.
triattention-budget       = 50
triattention-window       = 256
; Prunes every 128 decode tokens (raised from 64): scoring runs on CPU on this
; CUDA build (no GPU scorer for turbo K), so each event stalls the decode loop.
; Halving the frequency halves that stall with negligible eviction-quality impact.
triattention-interval     = 256

; load-on-startup = true → swap to the specified model at startup instead of the standard 27B.
load-on-startup = true


; =============================================================================
; qwen3.6-35b-a3b — Hybrid MoE (DeltaNet + MoE Attention), MTP-capable
;
; Architecture (qwen35moe): 40 main layers — 30 DeltaNet (linear-recurrent,
;               NO KV cache) + 10 MoE Attention (every 4th layer is full attn).
;               35B total / 3.8B active params (MoE FFN).
;               MTP supported: nextn_predict_layers loaded from GGUF (1 layer).
;
; VRAM budget (RTX 3090 24GB, IQ4_XS):
;   weights                        ~14.5 GB  (35B × ~3.3 bits effective)
;   DeltaNet recurrent state        ~1.5 GB  (recurrent layers, fixed regardless of ctx)
;   KV cache (turbo4/2)            ~0.009 GB per 1K ctx  (10 MoE attn layers, GQA)
;   draft-mtp KV (f16, 1L)        ~0.001 GB per 1K ctx
;   compute scratch                 ~1.0 GB  (batch=4096/ubatch=1024)
;   CUDA + misc                    ~0.5 GB
;   ─────────────────────────────────────
;   Fixed overhead                ~17.5 GB  → ~6.5 GB headroom for KV cache
;   fit will maximise ctx within the 256 MiB margin, floor 200K tokens.
;
; DeltaNet checkpoint budget: n_rows = n_parallel × (1 + n_ctx_checkpoints)
;
; Download:
;   docker compose run --rm llama-convert convert-st qwen3.6-35b-a3b --quant IQ4_XS --mtp
;   (produces /models/qwen3.6-35b-a3b-IQ4_XS-mtp.gguf + /models/qwen3.6-35b-a3b-mmproj.gguf)
; =============================================================================
[qwen3.6-35b-a3b]

model                     = /models/qwen3.6-35b-a3b-apex-APEX-MTP-I-Compact.gguf
mmproj                    = /models/qwen3.6-35b-a3b-apex-mmproj.gguf

ctx-size                  = 204800
rope-scaling              = yarn
rope-scale                = 6.25
yarn-orig-ctx             = 32768

; Raised from 2048 to match 27B: thinking output is structured/predictable,
; so capping early loses quality and cuts short the phase where speculation works best.
reasoning-budget          = 4096

; ctx-size intentionally omitted — fit will probe VRAM and maximise context,
; floored at fit-ctx = 200000 tokens with 256 MiB headroom (see [*] section).

; DeltaNet recurrent-state checkpointing (30 recurrent layers in 35B-A3B).
; ctx-checkpoints computed automatically by sync-env.py: ceil(ctx-size / checkpoint-every-n-tokens)
ctx-checkpoints           = 24
checkpoint-every-n-tokens = 8192

; Reasoning / thinking
reasoning                 = on
chat-template-kwargs      = {"preserve_thinking":true}

; Slot save/restore
slot-save-path            = /models/slots/qwen3.6-35b-a3b-apex

; TriAttention KV cache eviction (arXiv 2604.04921).
; Prunes lowest-scoring attention KV cells every tri-window decode tokens,
; keeping only tri-budget % of the cache. DeltaNet recurrent layers are
; unaffected (fixed-size state, not evictable).
;
; Pre-built stats from domvox/triattention-ggml (PPL-validated on Qwen3.5-35B-A3B):
;   wget -O config/qwen3.6-35b-a3b-triattention.bin \
;     https://github.com/domvox/triattention-ggml/raw/master/stats/qwen3.5-35b-a3b.bin
; Or generate locally:
;   docker compose run --rm llama-convert convert-st qwen3.6-35b-a3b --quant IQ4_XS --mtp
;
; Budget: percentage of attention KV cells to retain after each prune.
;   75 = keep 75% → ~33% attention speedup at 65K context
;   50 = keep 50% → ~50% speedup but measurable quality degradation
; Start conservative (75) and lower if quality holds.
;
; Window: recent tokens always protected from eviction (attention sinks + recent).
; Interval: score+prune every N decode tokens (overhead: <10ms/event on RTX 3090).
;
; DISABLED by default — requires /etc/llama-server/qwen3.6-35b-a3b-triattention.bin to exist.
; To enable: remove the leading semicolons from the lines below.
; triattention arg renamed from --triattention-stats in v2 config (commit 50fd78f4).
triattention              = /etc/llama-server/qwen3.6-35b-a3b-triattention.bin
; 50: 35B-A3B has 10/40 attention layers (25%), DeltaNet layers unaffected.
; Quality risk is low; matching 27B budget for consistency.
triattention-budget       = 50
triattention-window       = 256
; Prunes every 128 decode tokens (raised from 64): scoring runs on CPU on this
; CUDA build (no GPU scorer for turbo K), so each event stalls the decode loop.
; Halving the frequency halves that stall with negligible eviction-quality impact.
triattention-interval     = 256

; load-on-startup = true → load the APEX model at startup (set false to start on-demand only).
load-on-startup           = false
