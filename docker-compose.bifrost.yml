version: "3.8"

services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: bifrost
    ports:
      - "${BIFROST_PORT:-8080}:8080"
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - ./bifrost/data:/app/data
    environment:
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=${BIFROST_LOG_LEVEL:-info}
      - LOG_STYLE=json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
