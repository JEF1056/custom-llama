version: "3.8"

services:
  bifrost:
    build: ./
    container_name: bifrost
    ports:
      - "${BIFROST_PORT:-4000}:8080"
    volumes:
      - bifrost-data:/app/data
    environment:
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=${BIFROST_LOG_LEVEL:-info}
      - LOG_STYLE=json
      - BIFROST_SKIP_WRITE_CHECK=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bifrost-net

  websearch-crawler:
    image: laituanmanh/websearch-crawler:latest
    container_name: websearch-api
    restart: unless-stopped
    ports:
      - "${WEBSEARCH_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr
    volumes:
      - crawler_storage:/app/storage
    networks:
      - bifrost-net

  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    networks:
      - bifrost-net

 networks:
  bifrost-net:
    driver: bridge

volumes:
  bifrost-data:
  crawler_storage:
